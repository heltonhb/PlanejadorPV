<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A859"/><stop offset="100%" stop-color="#007A40"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7B731"/><stop offset="100%" stop-color="#E09E1A"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005CAA"/><stop offset="100%" stop-color="#003F7A"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E84C3D"/><stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F0FE"/><stop offset="100%" stop-color="#D0E0F8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="480" height="340" rx="16" fill="white" filter="url(#shadow)"/>

  <!-- Pizza chart (centered left side) -->
  <g transform="translate(30, 22)">
    <!-- Outer ring -->
    <circle cx="130" cy="130" r="120" fill="none" stroke="#E9ECEF" stroke-width="2"/>

    <!-- Sectors -->
    <path d="M130 130 L130 20 A110 110 0 0 1 222 64 Z" fill="url(#g1)" opacity="0.92"/>
    <path d="M130 130 L222 64 A110 110 0 0 1 215 195 Z" fill="url(#g2)" opacity="0.85"/>
    <path d="M130 130 L215 195 A110 110 0 0 1 130 240 Z" fill="url(#g3)" opacity="0.88"/>
    <path d="M130 130 L130 240 A110 110 0 0 1 38 130 Z" fill="url(#g4)" opacity="0.75"/>
    <path d="M130 130 L38 130 A110 110 0 0 1 130 20 Z" fill="url(#g5)" opacity="0.7"/>

    <!-- Labels inside sectors -->
    <text x="170" y="70" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">35%</text>
    <text x="185" y="145" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">25%</text>
    <text x="155" y="200" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">20%</text>
    <text x="70" y="155" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">12%</text>
    <text x="80" y="60" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#005CAA" text-anchor="middle">8%</text>

    <!-- Center hole (donut) -->
    <circle cx="130" cy="130" r="30" fill="white"/>
    <circle cx="130" cy="130" r="30" fill="none" stroke="url(#g3)" stroke-width="2"/>
    <text x="130" y="134" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#003F7A" text-anchor="middle">100%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(310, 42)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#003F7A">Cobertura</text>
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="11" fill="#6C757D">Distribuição por categoria</text>

    <rect x="0" y="46" width="14" height="14" rx="3" fill="#00A859"/>
    <text x="22" y="58" font-family="Inter, sans-serif" font-size="13" fill="#343A40">Planejamento</text>

    <rect x="0" y="76" width="14" height="14" rx="3" fill="#F7B731"/>
    <text x="22" y="88" font-family="Inter, sans-serif" font-size="13" fill="#343A40">Execução</text>

    <rect x="0" y="106" width="14" height="14" rx="3" fill="#005CAA"/>
    <text x="22" y="118" font-family="Inter, sans-serif" font-size="13" fill="#343A40">Análise</text>

    <rect x="0" y="136" width="14" height="14" rx="3" fill="#E84C3D"/>
    <text x="22" y="148" font-family="Inter, sans-serif" font-size="13" fill="#343A40">Otimização</text>

    <rect x="0" y="166" width="14" height="14" rx="3" fill="#E8F0FE" stroke="#005CAA" stroke-width="1"/>
    <text x="22" y="178" font-family="Inter, sans-serif" font-size="13" fill="#343A40">Inovação</text>
  </g>
</svg>
