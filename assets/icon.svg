<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005CAA"/>
      <stop offset="100%" stop-color="#003F7A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#007A40"/>
    </linearGradient>
  </defs>

  <!-- Círculo base -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" opacity="0.08"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#bg)" stroke-width="2"/>

  <!-- Pizza chart -->
  <path d="M60 60 L60 10 A50 50 0 0 1 108 38 Z" fill="#00A859" opacity="0.9"/>
  <path d="M60 60 L108 38 A50 50 0 0 1 86 104 Z" fill="#F7B731" opacity="0.8"/>
  <path d="M60 60 L86 104 A50 50 0 0 1 60 110 Z" fill="#005CAA" opacity="0.85"/>
  <path d="M60 60 L60 110 A50 50 0 0 1 12 60 Z" fill="#E84C3D" opacity="0.7"/>
  <path d="M60 60 L12 60 A50 50 0 0 1 60 10 Z" fill="#E8F0FE" opacity="0.6"/>

  <!-- Ponto central -->
  <circle cx="60" cy="60" r="8" fill="white" stroke="url(#bg)" stroke-width="2"/>

  <!-- Seta de crescimento -->
  <polyline points="32,84 48,68 58,74 74,54" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="74,54 66,50 76,50" fill="url(#accent)"/>
</svg>
